<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>MangaBaka authorization · kmworks</title>
    <link rel="stylesheet" href="/oauth/relay.css" />
    <script type="module" src="/oauth/relay.js"></script>
  </head>
  <body>
    <main class="relay-card" aria-labelledby="relay-title">
      <p class="relay-kicker">kmworks · OAuth relay</p>
      <h1 id="relay-title">MangaBaka authorization</h1>
      <p class="relay-description">
        Returning the authorization result to your KMServer instance.
      </p>
      <div id="relay-status" class="relay-status" role="status">
        Processing authorization…
      </div>
      <p id="relay-detail" class="relay-detail" aria-live="polite">
        You will be redirected automatically.
      </p>
      <noscript>
        <p class="relay-noscript">
          JavaScript is required to return the authorization result. Enable it
          and retry from KMServer.
        </p>
      </noscript>
    </main>
  </body>
</html>
